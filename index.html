<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Australia</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { background: #060a0f; font-family: 'Georgia', 'Times New Roman', serif; }

    /* Full-bleed map */
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; }

    /* ── Map title — bottom-left ── */
    #map-title {
      position: fixed; bottom: 48px; left: 36px; z-index: 20;
      pointer-events: none;
    }
    #map-title h1 {
      font-size: 2.2rem; font-weight: 400; letter-spacing: 0.08em;
      color: #fff; text-transform: uppercase; line-height: 1.1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
    }
    #map-title h2 {
      font-size: 0.85rem; font-weight: 400; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.55); text-transform: uppercase;
      margin-top: 4px; font-family: system-ui, sans-serif;
    }

    /* ── Story panel (legacy — unused) ── */
    #story-panel { display: none; }

    /* ── Sidebar map selector — left edge ── */
    #sidebar {
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 40;
      display: flex; align-items: stretch;
      pointer-events: none;
    }

    #sidebar-panel {
      width: 260px;
      background: rgba(6,10,15,0.92);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255,255,255,0.1);
      transform: translateX(-260px);
      transition: transform 0.25s ease;
      overflow-y: auto;
      pointer-events: all;
      display: flex; flex-direction: column;
    }
    #sidebar.open #sidebar-panel { transform: translateX(0); }

    #sidebar-tab {
      position: fixed; left: 0; top: 50%; transform: translateY(-50%);
      z-index: 41;
      writing-mode: vertical-rl; text-orientation: mixed;
      background: rgba(6,10,15,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-left: none;
      border-radius: 0 6px 6px 0;
      padding: 14px 8px;
      cursor: pointer; pointer-events: all;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transition: left 0.25s ease, background 0.15s;
    }
    #sidebar.open ~ #sidebar-tab { left: 260px; }
    #sidebar-tab:hover { background: rgba(255,255,255,0.08); }
    #sidebar-tab-label {
      color: rgba(255,255,255,0.7); font-size: 0.68rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      font-family: system-ui, sans-serif;
    }
    #sidebar-tab-arrow {
      color: rgba(255,255,255,0.4); font-size: 0.9rem;
      transition: transform 0.25s ease;
      display: inline-block;
      transform: rotate(90deg);
    }
    #sidebar.open ~ #sidebar-tab #sidebar-tab-arrow { transform: rotate(-90deg); }

    /* Sidebar overlay (closes on outside click) */
    #sidebar-overlay {
      display: none; position: fixed; inset: 0; z-index: 39;
    }
    #sidebar.open ~ #sidebar-overlay { display: block; }

    /* Sidebar inner padding */
    #sidebar-panel-inner { padding: 16px 0 24px; }

    /* Accordion groups */
    .sb-group { border-bottom: 1px solid rgba(255,255,255,0.06); }
    .sb-group-header {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 16px; cursor: pointer;
      transition: background 0.15s; user-select: none;
    }
    .sb-group-header:hover { background: rgba(255,255,255,0.05); }
    .sb-group-icon { font-size: 1rem; flex-shrink: 0; }
    .sb-group-label {
      flex: 1; color: rgba(255,255,255,0.75); font-size: 0.74rem;
      font-family: system-ui, sans-serif; letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .sb-group-chevron {
      color: rgba(255,255,255,0.3); font-size: 0.7rem;
      transition: transform 0.2s; flex-shrink: 0;
    }
    .sb-group.open .sb-group-chevron { transform: rotate(180deg); }

    .sb-group-items { display: none; }
    .sb-group.open .sb-group-items { display: block; }

    .map-option {
      padding: 10px 16px 10px 42px; cursor: pointer;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .map-option:last-child { border-bottom: none; }
    .map-option:hover { background: rgba(255,255,255,0.06); }
    .map-option.active {
      background: rgba(255,255,255,0.1);
      box-shadow: inset 3px 0 0 rgba(255,255,255,0.4);
    }
    .map-option .opt-title {
      color: rgba(255,255,255,0.9); font-size: 0.8rem;
      font-family: system-ui, sans-serif; letter-spacing: 0.03em;
    }
    .map-option .opt-sub {
      color: rgba(255,255,255,0.38); font-size: 0.68rem;
      font-family: system-ui, sans-serif; margin-top: 2px;
    }

    /* ── Story toggle button ── */
    #legend-story-btn {
      margin-top: 10px; width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 4px;
      color: rgba(255,255,255,0.45); font-size: 0.68rem;
      letter-spacing: 0.12em; text-transform: uppercase;
      padding: 7px 10px; cursor: pointer;
      font-family: system-ui, sans-serif; text-align: center;
    }
    #legend-story-btn:hover { color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.1); }

    /* ── Story panel — expands below button ── */
    #legend-story-panel {
      margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
      color: rgba(255,255,255,0.75);
      font-size: 0.82rem; line-height: 1.65;
      display: none;
    }

    /* ── Atlas wordmark — top-left ── */
    #wordmark {
      position: fixed; top: 24px; left: 28px; z-index: 20;
      pointer-events: none;
    }
    #wordmark span {
      font-size: 0.68rem; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); font-family: system-ui, sans-serif;
    }

    /* Scale control override */
    .maplibregl-ctrl-scale {
      background: rgba(6,10,15,0.6) !important;
      border-color: rgba(255,255,255,0.2) !important;
      color: rgba(255,255,255,0.5) !important;
      font-size: 10px !important;
    }

    /* Fade transition */
    #map { transition: opacity 0.4s ease; }
    #map.fading { opacity: 0; }

    /* ── Legend panel — top-left, flex column ── */
    #legend-panel {
      position: fixed; top: 24px; left: 28px; z-index: 20;
      background: rgba(6,10,15,0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 6px; padding: 14px 16px;
      min-width: 220px; max-width: 260px;
      display: none;
    }
    #legend-panel .legend-title {
      font-family: system-ui, sans-serif;
      font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 10px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 0; cursor: pointer; user-select: none;
    }
    .legend-item:hover .legend-label { color: rgba(255,255,255,0.95); }
    .legend-swatch {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
      transition: opacity 0.2s;
    }
    .legend-label {
      font-family: system-ui, sans-serif; font-size: 0.75rem;
      color: rgba(255,255,255,0.7); transition: color 0.2s;
      line-height: 1.2;
    }
    .legend-item.off .legend-swatch { opacity: 0.2; }
    .legend-item.off .legend-label  { color: rgba(255,255,255,0.3); text-decoration: line-through; }

    /* ── Event selector (fires / floods) — bottom-left, above title ── */
    #event-selector {
      position: fixed; bottom: 120px; left: 36px; z-index: 20;
      display: none;
    }
    .fy-label {
      font-family: system-ui, sans-serif; font-size: 0.65rem;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin-bottom: 8px;
    }
    #fy-buttons { display: flex; gap: 8px; flex-wrap: wrap; max-width: 340px; }
    .fy-btn {
      padding: 6px 14px;
      background: rgba(6,10,15,0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      color: rgba(255,255,255,0.55);
      font-family: system-ui, sans-serif; font-size: 0.73rem;
      cursor: pointer; transition: all 0.2s;
    }
    .fy-btn:hover { color: rgba(255,255,255,0.9); border-color: rgba(255,255,255,0.35); }
    .fy-btn.active { color: #fff; background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="wordmark"><span>Atlas Australia</span></div>

  <div id="map-title">
    <h1 id="title-main"></h1>
    <h2 id="title-sub"></h2>
  </div>

  <button id="story-btn" onclick="toggleStory()" style="display:none">About this map</button>
  <div id="story-panel"></div>

  <div id="sidebar">
    <div id="sidebar-panel">
      <div id="sidebar-panel-inner"></div>
    </div>
  </div>
  <div id="sidebar-tab" onclick="toggleSidebar()">
    <span id="sidebar-tab-label">Maps</span>
    <span id="sidebar-tab-arrow">›</span>
  </div>
  <div id="sidebar-overlay" onclick="closeSidebar()"></div>

  <div id="legend-panel">
    <div class="legend-title">Layers</div>
    <div id="legend-items"></div>
    <button id="legend-story-btn" onclick="toggleStory()">About this map</button>
    <div id="legend-story-panel"></div>
  </div>

  <div id="event-selector">
    <div class="fy-label" id="event-selector-label">Select event</div>
    <div id="fy-buttons"></div>
  </div>

  <script type="module">
    import { ATLAS_MAPS, DEFAULT_VIEW } from './src/maps.js';
    import { Protocol } from 'pmtiles';

    // Register PMTiles protocol so MapLibre can load pmtiles:// URLs
    const protocol = new Protocol();
    maplibregl.addProtocol('pmtiles', protocol.tile.bind(protocol));

    const STATE_COLOURS = [
      '#2563eb','#059669','#dc2626','#d97706',
      '#7c3aed','#0891b2','#be185d','#65a30d'
    ];

    let currentMapId = null;
    let statesGeoJSON = null;

    // ── Zoom based on window height ───────────────────────────
    // MapLibre uses 512px tiles. Australia spans ~-10° to -44° lat.
    function calcAustraliaZoom() {
      const toMercY = lat => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
      const mercSpan = toMercY(-10) - toMercY(-44);
      const worldFraction = mercSpan / (2 * Math.PI);
      const targetPx = window.innerHeight * 0.88;
      return Math.log2(targetPx / (512 * worldFraction));
    }

    // ── Init map ──────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: ATLAS_MAPS[0].baseStyle,
      center: DEFAULT_VIEW.center,
      zoom: calcAustraliaZoom(),
      minZoom: DEFAULT_VIEW.minZoom,
      maxZoom: DEFAULT_VIEW.maxZoom,
      // No maxBounds — it forces zoom up as window widens, defeating height-based sizing
      attributionControl: false,
    });

    // Re-fit on resize — only if user hasn't zoomed away from home
    map.on('resize', () => {
      const homeZoom = calcAustraliaZoom();
      if (Math.abs(map.getZoom() - homeZoom) < 0.6) {
        map.setZoom(homeZoom);
      }
    });

    map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-right');
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    // ── Load states GeoJSON once ──────────────────────────────
    async function loadStates() {
      const r = await fetch('./states.geojson');
      statesGeoJSON = await r.json();
    }

    // ── Build sidebar accordion ───────────────────────────────
    const SIDEBAR_GROUPS = [
      { key: 'base',        icon: '🗺️',  label: 'Base Styles' },
      { key: 'historical',  icon: '📜',  label: 'Historical Maps' },
      { key: 'disasters',   icon: '🔥',  label: 'Natural Disasters' },
      { key: 'environment', icon: '🌿',  label: 'Environment & Land' },
      { key: 'society',     icon: '🏛️',  label: 'Society & Data' },
    ];

    function buildSidebar() {
      const inner = document.getElementById('sidebar-panel-inner');
      inner.innerHTML = SIDEBAR_GROUPS.map(group => {
        const maps = ATLAS_MAPS.filter(m => m.category === group.key);
        const items = maps.map(m => `
          <div class="map-option" data-id="${m.id}" onclick="window._selectMap('${m.id}')">
            <div class="opt-title">${m.title}</div>
            <div class="opt-sub">${m.subtitle}</div>
          </div>
        `).join('');
        return `
          <div class="sb-group" data-group="${group.key}">
            <div class="sb-group-header" onclick="toggleGroup('${group.key}')">
              <span class="sb-group-icon">${group.icon}</span>
              <span class="sb-group-label">${group.label}</span>
              <span class="sb-group-chevron">▾</span>
            </div>
            <div class="sb-group-items">${items}</div>
          </div>
        `;
      }).join('');
    }

    // ── Apply a map ───────────────────────────────────────────
    async function applyMap(mapDef) {
      // Update title + story
      document.getElementById('title-main').textContent = mapDef.title;
      document.getElementById('title-sub').textContent = mapDef.subtitle;
      document.getElementById('legend-story-panel').textContent = mapDef.story;

      // Update legend
      const legendPanel = document.getElementById('legend-panel');
      const legendItems = document.getElementById('legend-items');
      if (mapDef.legend && mapDef.legend.length) {
        legendItems.innerHTML = mapDef.legend.map((entry, i) => `
          <div class="legend-item" id="legend-item-${i}" onclick="window._toggleLegendItem(${i})">
            <div class="legend-swatch" style="background:${entry.colour}"></div>
            <div class="legend-label">${entry.label}</div>
          </div>
        `).join('');
        legendPanel.style.display = 'block';

        window._toggleLegendItem = function(i) {
          const entry = mapDef.legend[i];
          const el = document.getElementById(`legend-item-${i}`);
          const isOff = el.classList.toggle('off');
          entry.layerIds.forEach(id => {
            if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', isOff ? 'none' : 'visible');
          });
        };
      } else {
        legendPanel.style.display = 'none';
        legendItems.innerHTML = '';
      }

      // Mark active in sidebar
      updateSidebarActive(mapDef.id);

      // Add state fill layer (unless map opts out with noStateFills)
      if (statesGeoJSON && !mapDef.noStateFills) {
        if (map.getLayer('state-fills')) map.removeLayer('state-fills');
        if (map.getLayer('state-lines')) map.removeLayer('state-lines');
        if (map.getSource('states'))    map.removeSource('states');

        map.addSource('states', { type: 'geojson', data: statesGeoJSON });

        const fills = mapDef.palette.fill;
        map.addLayer({
          id: 'state-fills',
          type: 'fill',
          source: 'states',
          paint: {
            'fill-color': [
              'match', ['get', 'STATE_CODE'],
              '1', fills[0] || STATE_COLOURS[0],
              '2', fills[1] || STATE_COLOURS[1],
              '3', fills[2] || STATE_COLOURS[2],
              '4', fills[3] || STATE_COLOURS[3],
              '5', fills[4] || STATE_COLOURS[4],
              '6', fills[5] || STATE_COLOURS[5],
              '7', fills[6] || STATE_COLOURS[6],
              '8', fills[7] || STATE_COLOURS[7],
              STATE_COLOURS[0]
            ],
            'fill-opacity': 0.55,
          }
        });

        map.addLayer({
          id: 'state-lines',
          type: 'line',
          source: 'states',
          paint: {
            'line-color': mapDef.palette.stroke || '#ffffff',
            'line-width': 0.8,
            'line-opacity': 0.6,
          }
        });
      } else if (statesGeoJSON && mapDef.noStateFills) {
        // Clean up state layers if switching from a map that had them
        if (map.getLayer('state-fills')) map.removeLayer('state-fills');
        if (map.getLayer('state-lines')) map.removeLayer('state-lines');
        if (map.getSource('states'))    map.removeSource('states');
      }

      // Add map-specific sources
      for (const src of (mapDef.sources || [])) {
        if (!map.getSource(src.id)) {
          map.addSource(src.id, src.spec);
        }
      }

      // Add map-specific layers (above state fills)
      for (const layerDef of (mapDef.layers || [])) {
        if (!map.getLayer(layerDef.id)) {
          // Insert before state outlines if present, otherwise add on top
          if (map.getLayer('state-lines')) {
            map.addLayer(layerDef, 'state-lines');
          } else {
            map.addLayer(layerDef);
          }
        }
      }

      // Enable / disable 3D terrain
      if (mapDef.terrain) {
        if (!map.getSource('terrain-dem')) {
          map.addSource('terrain-dem', {
            type: 'raster-dem',
            url: `https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=${MT}`,
            tileSize: 256,
          });
        }
        map.setTerrain({ source: 'terrain-dem', exaggeration: 1.5 });
        if (!map.getLayer('sky')) {
          map.addLayer({
            id: 'sky',
            type: 'sky',
            paint: {
              'sky-type': 'atmosphere',
              'sky-atmosphere-sun': [0.0, 90.0],
              'sky-atmosphere-sun-intensity': 15,
            },
          });
        }
      } else {
        map.setTerrain(null);
      }

      // Handle event selector (fires, floods, etc.)
      const evtSelector = document.getElementById('event-selector');
      const evtLabel    = document.getElementById('event-selector-label');
      const fyrButtons  = document.getElementById('fy-buttons');
      const sel = mapDef.eventSelector;
      if (sel && sel.events && sel.events.length) {
        evtLabel.textContent = sel.label || 'Select event';
        fyrButtons.innerHTML = sel.events.map(ev => `
          <button class="fy-btn" data-year="${ev.id}" data-colour="${ev.colour}"
            onclick="window._selectEvent('${ev.id}')">
            ${ev.label}
          </button>
        `).join('');
        evtSelector.style.display = 'block';
        window._currentEventMap = mapDef;
        window._selectEvent(sel.events[0].id);
      } else {
        evtSelector.style.display = 'none';
        window._currentEventMap = null;
      }
    }

    // ── Select event (fires / floods) ────────────────────────
    window._selectEvent = function(eventId) {
      const mapDef = window._currentEventMap;
      if (!mapDef || !mapDef.eventSelector) return;
      const prefix = mapDef.eventSelector.layerPrefix;
      mapDef.eventSelector.events.forEach(ev => {
        const vis = ev.id === eventId ? 'visible' : 'none';
        [`${prefix}-${ev.id}-fill`, `${prefix}-${ev.id}-outline`].forEach(lid => {
          if (map.getLayer(lid)) map.setLayoutProperty(lid, 'visibility', vis);
        });
      });
      document.querySelectorAll('.fy-btn').forEach(btn => {
        const active = btn.dataset.year === eventId;
        btn.classList.toggle('active', active);
        btn.style.borderColor = active ? btn.dataset.colour : '';
        btn.style.color = active ? btn.dataset.colour : '';
      });
    };

    // ── Select map (called from HTML onclick) ─────────────────
    window._selectMap = function(id) {
      if (id === currentMapId) { closeSidebar(); return; }
      const mapDef = ATLAS_MAPS.find(m => m.id === id);
      if (!mapDef) return;
      currentMapId = id;
      closeSidebar();

      // Reset to default Australia view when switching maps, or map's custom view
      const center = mapDef.initialCenter || DEFAULT_VIEW.center;
      const zoom   = mapDef.initialZoom   || calcAustraliaZoom();
      map.flyTo({ center, zoom, duration: 800 });

      // Switch base style then re-apply layers
      map.setStyle(mapDef.baseStyle);
      map.once('styledata', () => applyMap(mapDef));
    };

    // ── Sidebar open/close/toggle ─────────────────────────────
    window.toggleSidebar = function() {
      document.getElementById('sidebar').classList.toggle('open');
    };
    window.closeSidebar = function() {
      document.getElementById('sidebar').classList.remove('open');
    };
    window.toggleGroup = function(key) {
      const group = document.querySelector(`.sb-group[data-group="${key}"]`);
      if (group) group.classList.toggle('open');
    };
    function updateSidebarActive(id) {
      document.querySelectorAll('.map-option').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });
      // Auto-expand the group containing the active map
      const activeEl = document.querySelector(`.map-option[data-id="${id}"]`);
      if (activeEl) {
        const group = activeEl.closest('.sb-group');
        if (group) group.classList.add('open');
      }
    }

    // ── Story panel ───────────────────────────────────────────
    window.toggleStory = function() {
      const p = document.getElementById('legend-story-panel');
      p.style.display = p.style.display === 'block' ? 'none' : 'block';
    };

    // ── Bootstrap ─────────────────────────────────────────────
    map.on('load', async () => {
      await loadStates();
      buildSidebar();
      // Load first map
      const first = ATLAS_MAPS[0];
      currentMapId = first.id;
      await applyMap(first);
    });
  </script>
</body>
</html>
